<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
             display: grid;
             grid-template-rows: 75px 300px 600px ;
            grid-template-columns: 1fr;
            grid-template-areas: 
            "a  "
            "b  "
            "c "
              ;
            
        }
        @media(max-width:600px){
            body{
                grid-template-rows: 75px 250px 500px 200px 200px 200px;
            grid-template-columns:1fr;
            grid-template-areas: 
            "a "
            "b "
            "c "
            
            
            }
        }
        .a{
            grid-area: a;
            background-color: rgb(38, 97, 51);
        }
        .b{
            grid-area: b;
            background-color: rgb(148, 192, 148);
        }
        .c{
            grid-area: c;
            background-color: rgb(96, 112, 94);
        }
   
        </style>
</head>
<body>
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
    
</body>
</html>
